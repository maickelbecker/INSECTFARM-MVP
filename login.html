<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h2>Login</h2>

    <input id="login" type="text" placeholder="Email ou nome de usuário">
    <input id="senha" type="password" placeholder="Senha">

    <button id="btnEntrar">Entrar</button>

    <br><br>
    <a href="cadastro.html">Criar Conta</a>

  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getFirestore, collection, query, where, getDocs 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
      authDomain: "insectfarmmanager.firebaseapp.com",
      projectId: "insectfarmmanager",
      storageBucket: "insectfarmmanager.firebasestorage.app",
      messagingSenderId: "478537152748",
      appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
      measurementId: "G-47ZZLQSJVD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("btnEntrar").onclick = async function () {
      const loginValue = login.value.trim();
      const pass = senha.value.trim();

      if (!loginValue || !pass) {
        alert("Preencha todos os campos");
        return;
      }

      // Tenta login por email
      const qEmail = query(
        collection(db, "usuarios"),
        where("email", "==", loginValue),
        where("senha", "==", pass)
      );
      const rEmail = await getDocs(qEmail);

      // Tenta login por usuário
      const qUser = query(
        collection(db, "usuarios"),
        where("usuario", "==", loginValue),
        where("senha", "==", pass)
      );
      const rUser = await getDocs(qUser);

      if (rEmail.empty && rUser.empty) {
        alert("Login ou senha incorretos");
        return;
      }

      localStorage.setItem("usuarioLogado", loginValue);
      window.location.href = "dashboard.html";
    };
  </script>

</body>
</html>
