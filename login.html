<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login</title>
</head>
<body>

<h2>Login</h2>

<input id="usuario" placeholder="Usuário">
<input id="senha" type="password" placeholder="Senha">
<button id="btnEntrar">Entrar</button>
<button onclick="window.location.href='cadastro.html'">Criar conta</button>

<script>
document.getElementById("btnEntrar").onclick = function () {
    let email = usuario.value;
    let pass = senha.value;

    let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    let user = usuarios.find(u => u.email === email && u.senha === pass);

    if (!user) {
        alert("Usuário ou senha incorretos");
        return;
    }

    localStorage.setItem("usuarioLogado", JSON.stringify(user));
    window.location.href = "dashboard.html";
};
</script>

</body>
</html>
