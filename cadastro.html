<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cadastro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Cadastrar Usuário</h2>

    <input id="novoUsuario" placeholder="Novo usuário">
    <input id="novaSenha" type="password" placeholder="Nova senha">

    <button id="btnCadastrar">Cadastrar</button>
    <button onclick="window.location.href='login.html'">Voltar</button>
</div>

<script>
document.getElementById("btnCadastrar").onclick = function () {
    let email = novoUsuario.value;
    let pass = novaSenha.value;

    let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    if (usuarios.some(u => u.email === email)) {
        alert("Usuário já existe");
        return;
    }

    usuarios.push({ email: email, senha: pass });
    localStorage.setItem("usuarios", JSON.stringify(usuarios));

    alert("Usuário cadastrado!");
    window.location.href = "login.html";
};
</script>

</body>
</html>
