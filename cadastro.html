<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Criar Conta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h2>Criar Conta</h2>

    <input id="usuario" type="text" placeholder="Nome de usuário">
    <input id="email" type="email" placeholder="Email">
    <input id="senha" type="password" placeholder="Senha">
    <input id="senha2" type="password" placeholder="Repita a senha">

    <button id="btnCadastrar">Cadastrar</button>

    <br><br>
    <a href="login.html">Voltar ao Login</a>

  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, query, where, getDocs 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
      authDomain: "insectfarmmanager.firebaseapp.com",
      projectId: "insectfarmmanager",
      storageBucket: "insectfarmmanager.firebasestorage.app",
      messagingSenderId: "478537152748",
      appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
      measurementId: "G-47ZZLQSJVD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById("btnCadastrar").onclick = async function () {
      const user = usuario.value.trim();
      const mail = email.value.trim();
      const pass = senha.value.trim();
      const pass2 = senha2.value.trim();

      if (!user || !mail || !pass || !pass2) {
        alert("Preencha todos os campos");
        return;
      }

      if (pass !== pass2) {
        alert("As senhas não coincidem");
        return;
      }

      // Verifica se usuário já existe
      const qUser = query(
        collection(db, "usuarios"),
        where("usuario", "==", user)
      );
      const rUser = await getDocs(qUser);

      if (!rUser.empty) {
        alert("Este nome de usuário já está em uso");
        return;
      }

      // Verifica se email já existe
      const qEmail = query(
        collection(db, "usuarios"),
        where("email", "==", mail)
      );
      const rEmail = await getDocs(qEmail);

      if (!rEmail.empty) {
        alert("Este email já está cadastrado");
        return;
      }

      // Cria novo usuário
      await addDoc(collection(db, "usuarios"), {
        usuario: user,
        email: mail,
        senha: pass
      });

      alert("Conta criada com sucesso!");
      window.location.href = "login.html";
    };
  </script>

</body>
</html>
