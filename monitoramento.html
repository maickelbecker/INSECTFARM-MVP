<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Monitoramento</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>InsectFarmManager - MVP</h2>
    <ul>
        <li onclick="window.location.href='dashboard.html'">Dashboard</li>
        <li onclick="window.location.href='lotes.html'">Lotes</li>
        <li onclick="window.location.href='ciclos.html'">Ciclos</li>
        <li onclick="window.location.href='monitoramento.html'">Monitoramento</li>
        <li onclick="window.location.href='rendimento.html'">Rendimento</li>
    </ul>
</div>

<div class="content">
<h2>Monitoramento Ambiental</h2>

<label>Lote:</label>
<select id="lote"></select>

<label>Bandeja:</label>
<select id="bandeja"></select>

<label>Data do Registro:</label>
<input type="date" id="dataRegistro">

<p id="infoEstagio" style="font-weight: bold; margin-top: 10px;"></p>

<label>Temperatura (°C):</label>
<input type="number" id="temperatura">

<label>Umidade (%):</label>
<input type="number" id="umidade">

<button id="btnSalvarMonitoramento">Salvar</button>

<h3>Registros</h3>
<ul id="listaRegistros"></ul>
</div>

<script>
let user = JSON.parse(localStorage.getItem("usuarioLogado"));
if (!user) window.location.href = "login.html";

let lotes = JSON.parse(localStorage.getItem("lotes")) || [];
let ciclos = JSON.parse(localStorage.getItem("ciclos")) || [];
let monitoramento = JSON.parse(localStorage.getItem("monitoramento")) || [];

/* ======== CARREGAR LOTES ======== */
function carregarLotes() {
    lote.innerHTML = "";
    lotes.forEach(l => {
        lote.innerHTML += `<option value="${l.id}">Lote ${l.id}</option>`;
    });
    carregarBandejas();
}

/* ======== CARREGAR BANDEJAS ======== */
function carregarBandejas() {
    let l = lotes.find(x => x.id == lote.value);
    bandeja.innerHTML = "";
    for (let i = 1; i <= l.bandejas; i++) {
        bandeja.innerHTML += `<option value="${i}">Bandeja ${i}</option>`;
    }
    mostrarEstagio();
}

/* ======== MOSTRAR ESTÁGIO BIOLÓGICO ======== */
function mostrarEstagio() {
    let ciclo = ciclos.find(c => c.lote == lote.value && c.bandeja == bandeja.value);
    infoEstagio.textContent = ciclo ? `Estágio: ${ciclo.estagio}` : "Nenhum ciclo registrado";
}

/* ======== SALVAR MONITORAMENTO ======== */
document.getElementById("btnSalvarMonitoramento").onclick = function () {

    if (!dataRegistro.value || !temperatura.value || !umidade.value) {
        alert("Preencha todos os campos");
        return;
    }

    monitoramento.push({
        lote: Number(lote.value),
        bandeja: Number(bandeja.value),
        data: dataRegistro.value,
        temp: Number(temperatura.value),
        umid: Number(umidade.value),
        registro: new Date().toLocaleString()
    });

    localStorage.setItem("monitoramento", JSON.stringify(monitoramento));
    carregarRegistros();

    temperatura.value = "";
    umidade.value = "";
};

/* ======== LISTAR REGISTROS ======== */
function carregarRegistros() {
    listaRegistros.innerHTML = "";
    monitoramento.forEach(r => {
        let li = document.createElement("li");
        li.textContent =
            `Lote ${r.lote} | Bandeja ${r.bandeja} | Data: ${r.data} | ` +
            `Temp: ${r.temp}°C | Umid: ${r.umid}% | Registrado em: ${r.registro}`;
        listaRegistros.appendChild(li);
    });
}

/* ======== EVENTOS ======== */
lote.onchange = carregarBandejas;
bandeja.onchange = mostrarEstagio;

/* ======== INICIALIZAÇÃO ======== */
carregarLotes();
carregarRegistros();
</script>

</body>
</html>
