<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Monitoramento Ambiental</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h2>Monitoramento Ambiental</h2>

    <button onclick="window.location.href='dashboard.html'">⬅ Voltar</button>
    <br><br>

    <h3>Novo Registro</h3>

    <label>Lote:</label>
    <select id="selectLote"></select>

    <label>Temperatura (°C):</label>
    <input id="temperatura" type="number" step="0.1">

    <label>Umidade (%):</label>
    <input id="umidade" type="number" step="0.1">

    <label>Data do Registro:</label>
    <input id="dataRegistro" type="date">

    <button id="btnSalvar">Salvar Registro</button>

    <hr>

    <h3>Registros</h3>

    <table>
      <thead>
        <tr>
          <th>Lote</th>
          <th>Temperatura</th>
          <th>Umidade</th>
          <th>Data</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaMonitoramento"></tbody>
    </table>

  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
      authDomain: "insectfarmmanager.firebaseapp.com",
      projectId: "insectfarmmanager",
      storageBucket: "insectfarmmanager.firebasestorage.app",
      messagingSenderId: "478537152748",
      appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
      measurementId: "G-47ZZLQSJVD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const selectLote = document.getElementById("selectLote");
    const lista = document.getElementById("listaMonitoramento");

    // CARREGAR LOTES NO SELECT
    async function carregarLotes() {
      selectLote.innerHTML = "";

      const snapshot = await getDocs(collection(db, "lotes"));

      snapshot.forEach((docItem) => {
        const item = docItem.data();

        const option = document.createElement("option");
        option.value = docItem.id;
        option.textContent = `${item.data} - ${item.bandejas} bandejas`;

        selectLote.appendChild(option);
      });
    }

    // SALVAR REGISTRO
    document.getElementById("btnSalvar").onclick = async function () {
      const loteId = selectLote.value;
      const temp = temperatura.value;
      const umid = umidade.value;
      const data = dataRegistro.value;

      if (!loteId || !temp || !umid || !data) {
        alert("Preencha todos os campos");
        return;
      }

      await addDoc(collection(db, "monitoramento"), {
        loteId: loteId,
        temperatura: Number(temp),
        umidade: Number(umid),
        data: data
      });

      alert("Registro salvo com sucesso!");
      carregarMonitoramento();
    };

    // LISTAR REGISTROS
    async function carregarMonitoramento() {
      lista.innerHTML = "";

      const snapshot = await getDocs(collection(db, "monitoramento"));
      const lotesSnapshot = await getDocs(collection(db, "lotes"));

      // Mapa para buscar nome do lote
      const lotesMap = {};
      lotesSnapshot.forEach((l) => {
        lotesMap[l.id] = l.data();
      });

      snapshot.forEach((docItem) => {
        const item = docItem.data();

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${lotesMap[item.loteId]?.data || "Lote removido"}</td>
          <td>${item.temperatura}°C</td>
          <td>${item.umidade}%</td>
          <td>${item.data}</td>
          <td>
            <button onclick="excluirRegistro('${docItem.id}')" style="background:#d9534f;">Excluir</button>
          </td>
        `;

        lista.appendChild(tr);
      });
    }

    // EXCLUIR REGISTRO
    window.excluirRegistro = async function (id) {
      if (confirm("Deseja realmente excluir este registro?")) {
        await deleteDoc(doc(db, "monitoramento", id));
        carregarMonitoramento();
      }
    };

    // Carrega ao abrir a página
    carregarLotes();
    carregarMonitoramento();
  </script>

</body>
</html>
