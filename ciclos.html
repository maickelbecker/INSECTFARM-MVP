<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciar Ciclos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h2>Gerenciar Ciclos</h2>

    <button onclick="window.location.href='dashboard.html'">⬅ Voltar</button>
    <br><br>

    <h3>Novo Ciclo</h3>

    <select id="selectLote"></select>
    <input id="dataCiclo" type="date" placeholder="Data do ciclo">
    <input id="descricao" type="text" placeholder="Descrição (ex: Alimentação, Limpeza...)">

    <button id="btnSalvar">Salvar Ciclo</button>

    <hr>

    <h3>Ciclos Registrados</h3>

    <table>
      <thead>
        <tr>
          <th>Lote</th>
          <th>Data</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaCiclos"></tbody>
    </table>

  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
      authDomain: "insectfarmmanager.firebaseapp.com",
      projectId: "insectfarmmanager",
      storageBucket: "insectfarmmanager.firebasestorage.app",
      messagingSenderId: "478537152748",
      appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
      measurementId: "G-47ZZLQSJVD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const selectLote = document.getElementById("selectLote");
    const lista = document.getElementById("listaCiclos");

    // CARREGAR LOTES NO SELECT
    async function carregarLotes() {
      selectLote.innerHTML = "";

      const snapshot = await getDocs(collection(db, "lotes"));

      snapshot.forEach((docItem) => {
        const item = docItem.data();

        const option = document.createElement("option");
        option.value = docItem.id;
        option.textContent = `${item.data} - ${item.bandejas} bandejas`;

        selectLote.appendChild(option);
      });
    }

    // SALVAR CICLO
    document.getElementById("btnSalvar").onclick = async function () {
      const loteId = selectLote.value;
      const data = dataCiclo.value;
      const desc = descricao.value.trim();

      if (!loteId || !data || !desc) {
        alert("Preencha todos os campos");
        return;
      }

      await addDoc(collection(db, "ciclos"), {
        loteId: loteId,
        data: data,
        descricao: desc
      });

      alert("Ciclo registrado com sucesso!");
      carregarCiclos();
    };

    // LISTAR CICLOS
    async function carregarCiclos() {
      lista.innerHTML = "";

      const snapshot = await getDocs(collection(db, "ciclos"));
      const lotesSnapshot = await getDocs(collection(db, "lotes"));

      // Mapa para buscar nome do lote
      const lotesMap = {};
      lotesSnapshot.forEach((l) => {
        lotesMap[l.id] = l.data();
      });

      snapshot.forEach((docItem) => {
        const item = docItem.data();

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${lotesMap[item.loteId]?.data || "Lote removido"}</td>
          <td>${item.data}</td>
          <td>${item.descricao}</td>
          <td>
            <button class="red" onclick="excluirCiclo('${docItem.id}')">Excluir</button>
          </td>
        `;

        lista.appendChild(tr);
      });
    }

    // EXCLUIR CICLO
    window.excluirCiclo = async function (id) {
      if (confirm("Deseja realmente excluir este ciclo?")) {
        await deleteDoc(doc(db, "ciclos", id));
        carregarCiclos();
      }
    };

    // Carrega ao abrir a página
    carregarLotes();
    carregarCiclos();
  </script>

</body>
</html>
