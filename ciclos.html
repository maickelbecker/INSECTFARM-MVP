<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ciclos - InsectFarmManager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- SIDEBAR COMPLETA -->
<div class="sidebar">
  <h2>InsectFarmManager</h2>

  <div class="user-box">
    <p id="usuarioNome">Usuário</p>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>

  <ul>
    <li onclick="window.location.href='dashboard.html'">Dashboard</li>
    <li onclick="window.location.href='lotes.html'">Lotes</li>
    <li onclick="window.location.href='ciclos.html'">Ciclos</li>
    <li onclick="window.location.href='monitoramento.html'">Monitoramento</li>
    <li onclick="window.location.href='rendimento.html'">Rendimento</li>
    <li onclick="window.location.href='estimativa.html'">Estimativa</li>
    <li onclick="window.location.href='relatorio_estimativa.html'">Relatório</li>
  </ul>
</div>

<!-- CONTEÚDO PRINCIPAL -->
<div class="content">
  <h1>Ciclos</h1>

  <div class="card">
    <h3>Novo Ciclo</h3>

    <label>Lote</label>
    <select id="selectLote"></select>

    <label>Data de início</label>
    <input id="dataInicio" type="date">

    <label>Data prevista de colheita</label>
    <input id="dataColheita" type="date">

    <label>Observações</label>
    <textarea id="obs" rows="3" placeholder="Anotações importantes..."></textarea>

    <button id="btnSalvar">Salvar Ciclo</button>
  </div>

  <h3>Lista de Ciclos</h3>

  <table>
    <thead>
      <tr>
        <th>Lote</th>
        <th>Início</th>
        <th>Colheita prevista</th>
        <th>Observações</th>
        <th>Criado em</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="listaCiclos"></tbody>
  </table>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
  authDomain: "insectfarmmanager.firebaseapp.com",
  projectId: "insectfarmmanager",
  storageBucket: "insectfarmmanager.firebasestorage.app",
  messagingSenderId: "478537152748",
  appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
  measurementId: "G-47ZZLQSJVD"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const selectLote = document.getElementById("selectLote");
const lista = document.getElementById("listaCiclos");

// CARREGAR LOTES
async function carregarLotes() {
  selectLote.innerHTML = "";

  const snapshot = await getDocs(collection(db, "lotes"));
  snapshot.forEach(docItem => {
    const item = docItem.data();
    const option = document.createElement("option");
    option.value = docItem.id;
    option.textContent = `${item.data} - ${item.bandejas} bandejas`;
    selectLote.appendChild(option);
  });
}

// SALVAR CICLO
document.getElementById("btnSalvar").onclick = async function () {
  const loteId = selectLote.value;
  const inicio = document.getElementById("dataInicio").value;
  const colheita = document.getElementById("dataColheita").value;
  const obs = document.getElementById("obs").value.trim();

  if (!loteId || !inicio || !colheita) {
    alert("Preencha todos os campos obrigatórios.");
    return;
  }

  const criadoEm = new Date().toLocaleString("pt-BR");

  await addDoc(collection(db, "ciclos"), {
    loteId,
    inicio,
    colheita,
    obs,
    criadoEm
  });

  alert("Ciclo registrado com sucesso!");
  carregarCiclos();
};

// LISTAR CICLOS
async function carregarCiclos() {
  lista.innerHTML = "";

  const snapshot = await getDocs(collection(db, "ciclos"));
  const lotesSnapshot = await getDocs(collection(db, "lotes"));

  const lotesMap = {};
  lotesSnapshot.forEach(l => lotesMap[l.id] = l.data());

  const registros = [];
  snapshot.forEach(docItem => {
    registros.push({ id: docItem.id, ...docItem.data() });
  });

  registros.sort((a, b) => (a.inicio || "").localeCompare(b.inicio || ""));

  registros.forEach(item => {
    const tr = document.createElement("tr");

    const loteLabel = lotesMap[item.loteId]?.data || "Lote removido";

    tr.innerHTML = `
      <td>${loteLabel}</td>
      <td>${item.inicio}</td>
      <td>${item.colheita}</td>
      <td>${item.obs || "-"}</td>
      <td>${item.criadoEm || "-"}</td>
      <td>
        <button class="btn-red" onclick="excluirCiclo('${item.id}')">Excluir</button>
      </td>
    `;

    lista.appendChild(tr);
  });
}

window.excluirCiclo = async function (id) {
  if (confirm("Deseja realmente excluir este ciclo?")) {
    await deleteDoc(doc(db, "ciclos", id));
    carregarCiclos();
  }
};

carregarLotes();
carregarCiclos();
</script>

<!-- AUTENTICAÇÃO / SAIR -->
<script>
function sair() {
  localStorage.removeItem("usuarioLogado");
  window.location.href = "index.html";
}

document.addEventListener("DOMContentLoaded", () => {
  const usuario = localStorage.getItem("usuarioLogado");
  if (!usuario) {
    window.location.href = "index.html";
    return;
  }
  document.getElementById("usuarioNome").textContent = usuario;
});
</script>

</body>
</html>
