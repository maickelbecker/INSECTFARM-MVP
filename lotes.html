<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lotes - InsectFarmManager</title>
  <link rel="stylesheet" href="layout.css">
</head>
<body>

<!-- SIDEBAR COMPLETA -->
<div class="sidebar">
  <h2>InsectFarmManager</h2>

  <div class="user-box">
    <p id="usuarioNome">Usuário</p>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>

  <ul>
    <li onclick="window.location.href='dashboard.html'">Dashboard</li>
    <li onclick="window.location.href='lotes.html'">Lotes</li>
    <li onclick="window.location.href='ciclos.html'">Ciclos</li>
    <li onclick="window.location.href='monitoramento.html'">Monitoramento</li>
    <li onclick="window.location.href='rendimento.html'">Rendimento</li>
    <li onclick="window.location.href='estimativa.html'">Estimativa</li>
    <li onclick="window.location.href='relatorio_estimativa.html'">Relatório</li>
  </ul>
</div>

<!-- CONTEÚDO PRINCIPAL -->
<div class="content">
  <h1>Lotes</h1>

  <div class="card">
    <h3>Novo Lote</h3>

    <label>Data do lote</label>
    <input id="dataLote" type="date">

    <label>Número de bandejas</label>
    <input id="bandejas" type="number" min="1" placeholder="Ex: 12">

    <button id="btnSalvar">Salvar Lote</button>
  </div>

  <h3>Lista de Lotes</h3>

  <table>
    <thead>
      <tr>
        <th>Data</th>
        <th>Bandejas</th>
        <th>Criado em</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="listaLotes"></tbody>
  </table>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { 
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc 
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
  authDomain: "insectfarmmanager.firebaseapp.com",
  projectId: "insectfarmmanager",
  storageBucket: "insectfarmmanager.firebasestorage.app",
  messagingSenderId: "478537152748",
  appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
  measurementId: "G-47ZZLQSJVD"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const lista = document.getElementById("listaLotes");

// SALVAR LOTE
document.getElementById("btnSalvar").onclick = async function () {
  const data = document.getElementById("dataLote").value;
  const bandejas = Number(document.getElementById("bandejas").value);

  if (!data || !bandejas) {
    alert("Preencha todos os campos.");
    return;
  }

  const criadoEm = new Date().toLocaleString("pt-BR");

  await addDoc(collection(db, "lotes"), {
    data,
    bandejas,
    criadoEm
  });

  alert("Lote registrado com sucesso!");
  carregarLotes();
};

// LISTAR LOTES
async function carregarLotes() {
  lista.innerHTML = "";

  const snapshot = await getDocs(collection(db, "lotes"));
  const registros = [];

  snapshot.forEach(docItem => {
    registros.push({ id: docItem.id, ...docItem.data() });
  });

  registros.sort((a, b) => (a.data || "").localeCompare(b.data || ""));

  registros.forEach(item => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${item.data}</td>
      <td>${item.bandejas}</td>
      <td>${item.criadoEm || "-"}</td>
      <td>
        <button class="btn-red" onclick="excluirLote('${item.id}')">Excluir</button>
      </td>
    `;

    lista.appendChild(tr);
  });
}

window.excluirLote = async function (id) {
  if (confirm("Deseja realmente excluir este lote?")) {
    await deleteDoc(doc(db, "lotes", id));
    carregarLotes();
  }
};

carregarLotes();
</script>

<!-- AUTENTICAÇÃO / SAIR -->
<script>
function sair() {
  localStorage.removeItem("usuarioLogado");
  window.location.href = "index.html";
}

document.addEventListener("DOMContentLoaded", () => {
  const usuario = localStorage.getItem("usuarioLogado");
  if (!usuario) {
    window.location.href = "index.html";
    return;
  }
  document.getElementById("usuarioNome").textContent = usuario;
});
</script>

</body>
</html>
