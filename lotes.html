<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h2>Cadastrar Lote</h2>

    <!-- REMOVIDO: campo de número do lote -->
    <!-- <input id="numero" type="text" placeholder="Número do lote"> -->

    <input id="data" type="date">
    <input id="bandejas" type="number" placeholder="Quantidade de bandejas">

    <button id="btnSalvar">Salvar</button>

    <h3>Meus Lotes</h3>

    <table>
      <thead>
        <tr>
          <th>Número</th>
          <th>Data</th>
          <th>Bandejas</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaLotes"></tbody>
    </table>

  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, deleteDoc, doc,
      query, where, getDocs 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
      authDomain: "insectfarmmanager.firebaseapp.com",
      projectId: "insectfarmmanager",
      storageBucket: "insectfarmmanager.firebasestorage.app",
      messagingSenderId: "478537152748",
      appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
      measurementId: "G-47ZZLQSJVD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const usuarioLogado = localStorage.getItem("usuarioLogado");

    if (!usuarioLogado) {
      alert("Você precisa estar logado");
      window.location.href = "index.html";
    }

    // ============================
    // SALVAR LOTE (NÚMERO AUTOMÁTICO)
    // ============================
document.getElementById("btnSalvar").onclick = async function () {
  const dataLote = data.value.trim();
  const qtdBandejas = bandejas.value.trim();

  if (!dataLote || !qtdBandejas) {
    alert("Preencha todos os campos");
    return;
  }

  // Busca todos os lotes
  const snapshot = await getDocs(collection(db, "lotes"));

  let maiorNumero = 0;

  snapshot.forEach(docItem => {
    const dados = docItem.data();
    if (dados.numero > maiorNumero) {
      maiorNumero = dados.numero;
    }
  });

  const numeroGerado = maiorNumero + 1;

  await addDoc(collection(db, "lotes"), {
    numero: numeroGerado,
    data: dataLote,
    bandejas: Number(qtdBandejas),
    dono: usuarioLogado
  });

  carregarLotes();
};

    // ============================
    // LISTAR LOTES DO USUÁRIO
    // ============================
    async function carregarLotes() {
      const lista = document.getElementById("listaLotes");
      lista.innerHTML = "";

      const q = query(
        collection(db, "lotes"),
        where("dono", "==", usuarioLogado)
      );

      const snapshot = await getDocs(q);

      snapshot.forEach(docItem => {
        const dados = docItem.data();

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${dados.numero}</td>
          <td>${dados.data}</td>
          <td>${dados.bandejas}</td>
          <td>
            <button class="red" onclick="excluirLote('${docItem.id}')">Excluir</button>
          </td>
        `;

        lista.appendChild(tr);
      });
    }

    // ============================
    // EXCLUIR LOTE
    // ============================
    window.excluirLote = async function (id) {
      await deleteDoc(doc(db, "lotes", id));
      carregarLotes();
    };

    carregarLotes();
  </script>

</body>
</html>
