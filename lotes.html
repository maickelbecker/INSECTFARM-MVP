<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lotes</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>InsectFarmManager - MVP</h2>
    <ul>
        <li onclick="window.location.href='dashboard.html'">Dashboard</li>
        <li onclick="window.location.href='lotes.html'">Lotes</li>
        <li onclick="window.location.href='ciclos.html'">Ciclos</li>
        <li onclick="window.location.href='monitoramento.html'">Monitoramento</li>
    </ul>
</div>

<div class="content">
<h2>Registro de Lotes</h2>

<label>Data do lote:</label>
<input type="date" id="dataLote">

<label>Quantidade de bandejas:</label>
<input type="number" id="qtdBandejas" min="1">

<button id="btnSalvarLote">Salvar</button>

<h3>Lotes Registrados</h3>
<ul id="listaLotes"></ul>
</div>

<script>
let user = JSON.parse(localStorage.getItem("usuarioLogado"));
if (!user) window.location.href = "login.html";

document.getElementById("btnSalvarLote").onclick = function () {
    let lotes = JSON.parse(localStorage.getItem("lotes")) || [];

    if (!dataLote.value || !qtdBandejas.value) {
        alert("Preencha todos os campos");
        return;
    }

    let novoLote = {
        id: lotes.length + 1,
        data: dataLote.value,
        bandejas: Number(qtdBandejas.value)
    };

    lotes.push(novoLote);
    localStorage.setItem("lotes", JSON.stringify(lotes));

    carregarLotes();
    dataLote.value = "";
    qtdBandejas.value = "";
};

function carregarLotes() {
    let lotes = JSON.parse(localStorage.getItem("lotes")) || [];
    listaLotes.innerHTML = "";

    lotes.forEach(l => {
        let li = document.createElement("li");
        li.textContent = `Lote ${l.id} — ${l.data} — ${l.bandejas} bandejas`;
        listaLotes.appendChild(li);
    });
}

carregarLotes();
</script>

</body>
</html>
