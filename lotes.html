<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lotes</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 220px;
      height: 100vh;
      background: #343a40;
      padding: 20px;
      color: white;
    }

    .sidebar h2 {
      margin-bottom: 20px;
      font-size: 20px;
      text-align: center;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
    }

    .sidebar li {
      padding: 12px;
      margin-bottom: 8px;
      background: #495057;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
    }

    .sidebar li:hover {
      background: #6c757d;
    }

    .content {
      margin-left: 260px;
      padding: 20px;
      width: calc(100% - 260px);
      height: 100vh;
      overflow-y: auto;
    }

    input {
      padding: 10px;
      margin-right: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 10px 20px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      border-radius: 8px;
      overflow: hidden;
    }

    table th, table td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
      font-size: 15px;
    }

    table th {
      background: #f1f1f1;
      font-weight: bold;
    }

    table tr:hover {
      background: #f9f9f9;
    }

    button.red {
      background: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    button.red:hover {
      background: #b02a37;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>InsectFarmManager</h2>
    <ul>
      <li onclick="window.location.href='dashboard.html'">Dashboard</li>
      <li onclick="window.location.href='lotes.html'">Lotes</li>
      <li onclick="window.location.href='ciclos.html'">Ciclos</li>
      <li onclick="window.location.href='monitoramento.html'">Monitoramento</li>
      <li onclick="window.location.href='rendimento.html'">Rendimento</li>
      <li onclick="window.location.href='qualidade.html'">Qualidade da Produção</li>
      <li onclick="sair()">Sair</li>
    </ul>
  </div>

  <div class="content">

    <h2>Cadastrar Lote</h2>

    <input id="data" type="date">
    <input id="bandejas" type="number" placeholder="Quantidade de bandejas">

    <button id="btnSalvar">Salvar</button>

    <h3>Meus Lotes</h3>

    <table>
      <thead>
        <tr>
          <th>Número</th>
          <th>Data</th>
          <th>Bandejas</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaLotes"></tbody>
    </table>

  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, deleteDoc, doc,
      query, where, getDocs, orderBy
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
      authDomain: "insectfarmmanager.firebaseapp.com",
      projectId: "insectfarmmanager",
      storageBucket: "insectfarmmanager.firebasestorage.app",
      messagingSenderId: "478537152748",
      appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
      measurementId: "G-47ZZLQSJVD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const usuarioLogado = localStorage.getItem("usuarioLogado");

    if (!usuarioLogado) {
      alert("Você precisa estar logado");
      window.location.href = "login.html";
    }

    document.getElementById("btnSalvar").onclick = async function () {
      const dataLote = data.value.trim();
      const qtdBandejas = bandejas.value.trim();

      if (!dataLote || !qtdBandejas) {
        alert("Preencha todos os campos");
        return;
      }

      const q = query(
        collection(db, "lotes"),
        where("dono", "==", usuarioLogado)
      );

      const snapshot = await getDocs(q);

      let maiorNumero = 0;

      snapshot.forEach(docItem => {
        const dados = docItem.data();
        if (dados.numero > maiorNumero) {
          maiorNumero = dados.numero;
        }
      });

      const numeroGerado = maiorNumero + 1;

      await addDoc(collection(db, "lotes"), {
        numero: numeroGerado,
        data: dataLote,
        bandejas: Number(qtdBandejas),
        dono: usuarioLogado
      });

      carregarLotes();
    };

    async function carregarLotes() {
      const lista = document.getElementById("listaLotes");
      lista.innerHTML = "";

      const q = query(
        collection(db, "lotes"),
        where("dono", "==", usuarioLogado),
        orderBy("numero", "asc")
      );

      const snapshot = await getDocs(q);

      snapshot.forEach(docItem => {
        const dados = docItem.data();

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${dados.numero}</td>
          <td>${dados.data}</td>
          <td>${dados.bandejas}</td>
          <td>
            <button class="red" onclick="excluirLote('${docItem.id}')">Excluir</button>
          </td>
        `;

        lista.appendChild(tr);
      });
    }

    window.excluirLote = async function (id) {
      await deleteDoc(doc(db, "lotes", id));
      carregarLotes();
    };

    carregarLotes();

    window.sair = function () {
      localStorage.removeItem("usuarioLogado");
      window.location.href = "login.html";
    };
  </script>

</body>
</html>
