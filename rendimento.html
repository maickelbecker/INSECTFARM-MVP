<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Rendimento da Produção</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h2>Rendimento da Produção</h2>

    <button class="btn-voltar" onclick="window.location.href='dashboard.html'">⬅ Voltar</button>

    <h3>Novo Registro de Rendimento</h3>

    <div class="form-grid">
      <select id="selectLote"></select>
      <input id="peso" type="number" step="0.01" placeholder="Peso final (kg)">
      <input id="mortalidade" type="number" step="0.1" placeholder="Mortalidade (%)">
      <input id="dataRegistro" type="date">
      <button id="btnSalvar" class="btn-salvar">Salvar Rendimento</button>
    </div>

    <hr>

    <h3>Histórico de Rendimento</h3>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Lote</th>
            <th>Peso Final</th>
            <th>Mortalidade</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="listaRendimento"></tbody>
      </table>
    </div>

  </div>

  <!-- Firebase -->
  <script type="module">
    /* SEU JS PERMANECE IGUAL */
  </script>

</body>
</html>
