<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Rendimento da Produção</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h2>Rendimento da Produção</h2>

    <button onclick="window.location.href='dashboard.html'">⬅ Voltar</button>
    <br><br>

    <h3>Novo Registro de Rendimento</h3>

    <select id="selectLote"></select>
    <input id="peso" type="number" step="0.01" placeholder="Peso final (kg)">
    <input id="mortalidade" type="number" step="0.1" placeholder="Mortalidade (%)">
    <input id="dataRegistro" type="date">

    <button id="btnSalvar">Salvar Rendimento</button>

    <hr>

    <h3>Histórico de Rendimento</h3>

    <table>
      <thead>
        <tr>
          <th>Lote</th>
          <th>Peso Final</th>
          <th>Mortalidade</th>
          <th>Data</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaRendimento"></tbody>
    </table>

  </div>

  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, getDocs, deleteDoc, doc 
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
      authDomain: "insectfarmmanager.firebaseapp.com",
      projectId: "insectfarmmanager",
      storageBucket: "insectfarmmanager.firebasestorage.app",
      messagingSenderId: "478537152748",
      appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
      measurementId: "G-47ZZLQSJVD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const selectLote = document.getElementById("selectLote");
    const lista = document.getElementById("listaRendimento");

    // CARREGAR LOTES NO SELECT
    async function carregarLotes() {
      selectLote.innerHTML = "";

      const snapshot = await getDocs(collection(db, "lotes"));

      snapshot.forEach((docItem) => {
        const item = docItem.data();

        const option = document.createElement("option");
        option.value = docItem.id;
        option.textContent = `${item.data} - ${item.bandejas} bandejas`;

        selectLote.appendChild(option);
      });
    }

    // SALVAR RENDIMENTO
    document.getElementById("btnSalvar").onclick = async function () {
      const loteId = selectLote.value;
      const pesoFinal = peso.value;
      const mort = mortalidade.value;
      const data = dataRegistro.value;

      if (!loteId || !pesoFinal || !mort || !data) {
        alert("Preencha todos os campos");
        return;
      }

      await addDoc(collection(db, "rendimento"), {
        loteId: loteId,
        pesoFinal: Number(pesoFinal),
        mortalidade: Number(mort),
        data: data
      });

      alert("Rendimento registrado com sucesso!");
      carregarRendimento();
    };

    // LISTAR RENDIMENTO
    async function carregarRendimento() {
      lista.innerHTML = "";

      const snapshot = await getDocs(collection(db, "rendimento"));
      const lotesSnapshot = await getDocs(collection(db, "lotes"));

      // Mapa para buscar nome do lote
      const lotesMap = {};
      lotesSnapshot.forEach((l) => {
        lotesMap[l.id] = l.data();
      });

      snapshot.forEach((docItem) => {
        const item = docItem.data();

        const tr = document.createElement("tr");

        tr.innerHTML = `
          <td>${lotesMap[item.loteId]?.data || "Lote removido"}</td>
          <td>${item.pesoFinal} kg</td>
          <td>${item.mortalidade}%</td>
          <td>${item.data}</td>
          <td>
            <button class="red" onclick="excluirRendimento('${docItem.id}')">Excluir</button>
          </td>
        `;

        lista.appendChild(tr);
      });
    }

    // EXCLUIR RENDIMENTO
    window.excluirRendimento = async function (id) {
      if (confirm("Deseja realmente excluir este registro?")) {
        await deleteDoc(doc(db, "rendimento", id));
        carregarRendimento();
      }
    };

    // Carrega ao abrir a página
    carregarLotes();
    carregarRendimento();
  </script>

</body>
</html>
