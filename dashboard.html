<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">
    <h2>InsectFarmManager - MVP</h2>
    <ul>
        <li onclick="window.location.href='dashboard.html'">Dashboard</li>
        <li onclick="window.location.href='lotes.html'">Lotes</li>
        <li onclick="window.location.href='ciclos.html'">Ciclos</li>
        <li onclick="window.location.href='monitoramento.html'">Monitoramento</li>
    </ul>
</div>

<div class="content">
    <h1>Bem-vindo ao InsectFarmManager!</h1>

    <div class="cards">

        <div class="card">
            <h3>Registrar Lotes</h3>
            <p>Digitar Lotes</p>
            <button onclick="window.location.href='lotes.html'">Acessar</button>
        </div>

        <div class="card">
            <h3>Ciclos Biológicos</h3>
            <p>Ciclos Biológicos</p>
            <button onclick="window.location.href='ciclos.html'">Acessar</button>
        </div>

        <div class="card">
            <h3>Monitoramento Ambiental</h3>
            <p>Monitoramento Ambiental</p>
            <button onclick="window.location.href='monitoramento.html'">Acessar</button>
        </div>

    </div>
</div>

<script>
let user = JSON.parse(localStorage.getItem("usuarioLogado"));
if (!user) window.location.href = "login.html";
</script>

</body>
</html>
