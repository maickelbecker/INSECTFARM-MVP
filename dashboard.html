<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - InsectFarmManager</title>
  <link rel="stylesheet" href="layout.css">
</head>
<body>

<div class="sidebar">
  <h2>InsectFarmManager</h2>

  <div class="user-box">
    <p id="usuarioNome">Usuário</p>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>

  <ul>
    <li onclick="window.location.href='dashboard.html'">Dashboard</li>
    <li onclick="window.location.href='lotes.html'">Lotes</li>
    <li onclick="window.location.href='ciclos.html'">Ciclos</li>
    <li onclick="window.location.href='monitoramento.html'">Monitoramento</li>
    <li onclick="window.location.href='rendimento.html'">Rendimento</li>
    <li onclick="window.location.href='estimativa.html'">Estimativa</li>
    <li onclick="window.location.href='relatorio_estimativa.html'">Relatório</li>
  </ul>
</div>

<div class="content">
  <h1>Bem-vindo ao InsectFarmManager!</h1>

  <div class="cards">
    <div class="card">
      <h3>Total de Lotes</h3>
      <p id="totalLotes">0</p>
    </div>

    <div class="card">
      <h3>Registros de Monitoramento</h3>
      <p id="totalMonitoramento">0</p>
    </div>

    <div class="card">
      <h3>Registros de Rendimento</h3>
      <p id="totalRendimento">0</p>
    </div>

    <div class="card">
      <h3>Estimativas Geradas</h3>
      <p id="totalEstimativas">0</p>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
  authDomain: "insectfarmmanager.firebaseapp.com",
  projectId: "insectfarmmanager",
  storageBucket: "insectfarmmanager.firebasestorage.app",
  messagingSenderId: "478537152748",
  appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
  measurementId: "G-47ZZLQSJVD"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function carregarDashboard() {
  const lotes = await getDocs(collection(db, "lotes"));
  const monitoramento = await getDocs(collection(db, "monitoramento"));
  const rendimento = await getDocs(collection(db, "rendimento"));
  const estimativas = await getDocs(collection(db, "estimativas"));

  document.getElementById("totalLotes").textContent = lotes.size;
  document.getElementById("totalMonitoramento").textContent = monitoramento.size;
  document.getElementById("totalRendimento").textContent = rendimento.size;
  document.getElementById("totalEstimativas").textContent = estimativas.size;
}

carregarDashboard();
</script>

<script>
function sair() {
  localStorage.removeItem("usuarioLogado");
  window.location.href = "index.html";
}

document.addEventListener("DOMContentLoaded", () => {
  const usuario = localStorage.getItem("usuarioLogado");
  if (!usuario) {
    window.location.href = "index.html";
    return;
  }
  document.getElementById("usuarioNome").textContent = usuario;
});
</script>

</body>
</html>
