<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório de Estimativas - InsectFarmManager</title>
  <link rel="stylesheet" href="layout.css">
</head>
<body>

<!-- SIDEBAR COMPLETA -->
<div class="sidebar">
  <h2>InsectFarmManager</h2>

  <div class="user-box">
    <p id="usuarioNome">Usuário</p>
    <button class="btn-sair" onclick="sair()">Sair</button>
  </div>

  <ul>
    <li onclick="window.location.href='dashboard.html'">Dashboard</li>
    <li onclick="window.location.href='lotes.html'">Lotes</li>
    <li onclick="window.location.href='ciclos.html'">Ciclos</li>
    <li onclick="window.location.href='monitoramento.html'">Monitoramento</li>
    <li onclick="window.location.href='rendimento.html'">Rendimento</li>
    <li onclick="window.location.href='estimativa.html'">Estimativa</li>
    <li onclick="window.location.href='relatorio_estimativa.html'">Relatório</li>
  </ul>
</div>

<!-- CONTEÚDO PRINCIPAL -->
<div class="content">
  <h1>Relatório de Estimativas</h1>

  <div class="card">
    <h3>Filtros</h3>

    <label>Lote</label>
    <select id="selectLote">
      <option value="">Todos</option>
    </select>

    <label>Bandeja</label>
    <select id="selectBandeja">
      <option value="">Todas</option>
    </select>

    <button id="btnFiltrar">Aplicar Filtros</button>
  </div>

  <h3>Resultados</h3>

  <table>
    <thead>
      <tr>
        <th>Lote</th>
        <th>Bandeja</th>
        <th>Peso vivo</th>
        <th>Crescimento</th>
        <th>Relação vivo/seco</th>
        <th>Estimativa seca</th>
        <th>Registrado em</th>
      </tr>
    </thead>
    <tbody id="listaRelatorio"></tbody>
  </table>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBd-iIfDpxpjmrISWZMw_0-sVE9Fj0_C5M",
  authDomain: "insectfarmmanager.firebaseapp.com",
  projectId: "insectfarmmanager",
  storageBucket: "insectfarmmanager.firebasestorage.app",
  messagingSenderId: "478537152748",
  appId: "1:478537152748:web:b5e8217930bd9a5e550dc9",
  measurementId: "G-47ZZLQSJVD"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const selectLote = document.getElementById("selectLote");
const selectBandeja = document.getElementById("selectBandeja");
const lista = document.getElementById("listaRelatorio");

// CARREGAR LOTES
async function carregarLotes() {
  const snapshot = await getDocs(collection(db, "lotes"));

  snapshot.forEach(docItem => {
    const item = docItem.data();
    const opt = document.createElement("option");
    opt.value = docItem.id;
    opt.textContent = `${item.data} - ${item.bandejas} bandejas`;
    selectLote.appendChild(opt);
  });
}

// CARREGAR BANDEJAS
async function carregarBandejas() {
  selectBandeja.innerHTML = `<option value="">Todas</option>`;

  const loteId = selectLote.value;
  if (!loteId) return;

  const snapshot = await getDocs(collection(db, "lotes"));
  snapshot.forEach(docItem => {
    if (docItem.id === loteId) {
      const dados = docItem.data();
      for (let i = 1; i <= dados.bandejas; i++) {
        const opt = document.createElement("option");
        opt.value = i;
        opt.textContent = "Bandeja " + i;
        selectBandeja.appendChild(opt);
      }
    }
  });
}

selectLote.onchange = carregarBandejas;

// CARREGAR RELATÓRIO
async function carregarRelatorio() {
  lista.innerHTML = "";

  const loteFiltro = selectLote.value;
  const bandejaFiltro = selectBandeja.value;

  const snapshot = await getDocs(collection(db, "estimativas"));
  const lotesSnapshot = await getDocs(collection(db, "lotes"));

  const lotesMap = {};
  lotesSnapshot.forEach(l => lotesMap[l.id] = l.data());

  const registros = [];
  snapshot.forEach(docItem => {
    const item = { id: docItem.id, ...docItem.data() };

    if (loteFiltro && item.loteId !== loteFiltro) return;
    if (bandejaFiltro && item.bandeja != bandejaFiltro) return;

    registros.push(item);
  });

  registros.sort((a, b) => (a.criadoEm || "").localeCompare(b.criadoEm || ""));

  registros.forEach(item => {
    const tr = document.createElement("tr");

    const loteLabel = lotesMap[item.loteId]?.data || "Lote removido";

    tr.innerHTML = `
      <td>${loteLabel}</td>
      <td>${item.bandeja}</td>
      <td>${item.pesoVivo} g</td>
      <td>${item.taxa}%</td>
      <td>${item.relacao}%</td>
      <td>${item.secoPrevisto.toFixed(2)} g</td>
      <td>${item.criadoEm}</td>
    `;

    lista.appendChild(tr);
  });
}

document.getElementById("btnFiltrar").onclick = carregarRelatorio;

carregarLotes();
carregarRelatorio();
</script>

<!-- AUTENTICAÇÃO / SAIR -->
<script>
function sair() {
  localStorage.removeItem("usuarioLogado");
  window.location.href = "index.html";
}

document.addEventListener("DOMContentLoaded", () => {
  const usuario = localStorage.getItem("usuarioLogado");
  if (!usuario) {
    window.location.href = "index.html";
    return;
  }
  document.getElementById("usuarioNome").textContent = usuario;
});
</script>

</body>
</html>
